# Déploiement Netlify du frontend (site Netlify dont le « Base directory » est frontend/)
# Netlify détecte Next.js et installe automatiquement son adaptateur.
# Variable d'environnement à définir dans Netlify : BACKEND_URL = URL du site backend
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
