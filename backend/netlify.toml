# Déploiement Netlify du backend (site Netlify dont le « Base directory » est backend/)
[build]
  command = "echo 'Pas de build pour l API'"
  publish = "public"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Toute l'API passe par la fonction Express
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200
